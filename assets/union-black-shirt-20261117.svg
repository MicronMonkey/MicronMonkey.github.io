<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="t d"><title id="t">美光關工黑衣集結活動</title><desc id="d">11月13日12時30分午休集結，11月17日10時記者會，一起搭車北上，全台美光團結。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101116"/><stop offset="1" stop-color="#293140"/></linearGradient><linearGradient id="g"><stop stop-color="#ffe27e"/><stop offset="1" stop-color="#f2ad32"/></linearGradient></defs><rect width="900" height="760" fill="url(#b)"/><path d="M0 150L900 0M0 390L900 235M0 690L900 525" stroke="#f2ad32" stroke-width="2" opacity=".16"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" text-anchor="middle" font-weight="900"><text x="450" y="112" font-size="89" fill="url(#g)">美光關工</text><text x="450" y="188" font-size="69" fill="#fff">黑衣集結活動</text><rect x="95" y="219" width="710" height="65" rx="8" fill="#9d2928"/><text x="450" y="266" font-size="39" fill="#fff">儘速發牌「美光關工」</text><rect x="45" y="305" width="810" height="58" rx="5" fill="#efc757"/><text x="450" y="347" font-size="37" fill="#161616">拒絕黑箱協議・抗議濫訴打壓</text><text x="450" y="419" font-size="41" fill="#f9cf64">活動 01｜11/13（五）</text><text x="450" y="469" font-size="30" fill="#fff">12:30 午休集結</text><text x="450" y="507" font-size="26" fill="#d8dee9">公共藝術「飛越AI」裝置藝術前</text><path d="M65 537H835" stroke="#f9cf64" stroke-width="4" stroke-dasharray="20 12"/><text x="450" y="589" font-size="41" fill="#f9cf64">活動 02｜11/17（二）</text><text x="450" y="636" font-size="30" fill="#fff">10:00 記者會｜桃園市政府</text><rect x="105" y="660" width="690" height="76" rx="16" fill="#bb3533"/><text x="450" y="714" font-size="42" fill="#fff">一起搭車北上・全台美光團結！</text></g></svg>