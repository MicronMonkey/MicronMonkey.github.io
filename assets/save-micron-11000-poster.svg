<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1376" width="1100" height="1376">
<defs><linearGradient id="bg" x1="0" x2="0.5" y1="0" y2="1"><stop offset="0.58" stop-color="#141b36"/><stop offset="0.79" stop-color="#322042"/><stop offset="1" stop-color="#b64c39"/></linearGradient><linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6c4560"/><stop offset=".55" stop-color="#b95843"/><stop offset="1" stop-color="#6f4962"/></linearGradient></defs>
<rect width="1100" height="1376" fill="url(#bg)"/>
<g font-family="Noto Sans TC,Microsoft JhengHei,PingFang TC,sans-serif">
<text x="74" y="96" font-size="30" font-weight="700" fill="#f0bd77">給各政黨候選人、台中・后里・桃園鄉親、每一位看到的人</text>
<text x="74" y="298" font-size="177" font-weight="900" letter-spacing="-6" fill="white">救救美光</text>
<text x="74" y="373" font-size="46" font-weight="800" fill="#f0bd77">11,000 多位工會會員的自救行動</text>
<g fill="#f2f0f5" font-size="37">
<text x="74" y="466">一份影響 11,000 多位會員的協議，</text>
<text x="74" y="528" font-weight="700">簽下之前沒有表決，也沒有向會員說明。</text>
<text x="74" y="592">「一切合法」？會員從沒被問過。</text>
</g>
<rect x="74" y="633" width="5" height="178" fill="#f1b968"/>
<g fill="#f1edf3" font-size="32"><text x="104" y="681">理監事任期只到11月，卻以「正在進行勞資爭議調解」</text><text x="104" y="741">為由，開會決議自行延長任期。</text><text x="104" y="796">更何況，調解已經撤回，根本沒有在進行。</text></g>
<rect x="73" y="886" width="954" height="228" rx="25" fill="#fff"/>
<text x="115" y="956" font-size="38" font-weight="800" fill="#1b1b2f">黑箱協議・自行延任・會員認為已不適任</text>
<text x="114" y="1072" font-size="112" font-weight="900" fill="#b12520">依法下台</text>
<rect x="73" y="1136" width="954" height="89" rx="20" fill="url(#fire)" stroke="#f1c37c" stroke-width="3"/>
<text x="275" y="1193" font-size="40" font-weight="800" fill="#fff"><tspan fill="#f1bd78">美國也有人挺我們</tspan>，台灣的你呢？</text>
<text x="199" y="1315" font-size="40" font-weight="800" fill="#fff">請關注・請轉傳・讓會員的聲音被聽見</text>
</g></svg>