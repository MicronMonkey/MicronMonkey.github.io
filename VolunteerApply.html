<!DOCTYPE html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#111821;color:#f1f5f9;font-family:system-ui,'PingFang TC',sans-serif;line-height:1.6}main{padding:22px;max-width:800px;margin:auto}h2{font-size:25px;margin:4px 0}p{margin:7px 0 17px;color:#bdc8d6;font-size:14px}.tag{font-size:11px;letter-spacing:.12em;color:#d8bc87;font-weight:800}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0 18px}.tabs label{border:1px solid #5b6572;border-radius:12px;padding:13px;cursor:pointer}.tabs label:has(input:checked){border-color:#e8c78c;background:#343025}.tabs input{accent-color:#e8c78c}.field{margin-top:13px}label.t{display:block;font-weight:750;margin-bottom:6px;font-size:14px}input[type=text],input[type=tel],select{width:100%;background:#202b37;border:1px solid #556171;color:white;border-radius:10px;min-height:43px;padding:10px 12px;font-size:15px}input:focus{outline:2px solid #c5a66e}fieldset{border:1px solid #4b586a;border-radius:14px;margin:17px 0;padding:10px 13px}legend{color:#d3bd97;font-weight:800;padding:0 4px}fieldset label{display:block;padding:7px 0;font-size:14px;cursor:pointer}input[type=checkbox]{accent-color:#d9bc89;margin-right:8px}.muted{color:#9eacbe;font-size:12px}.hint{border-left:3px solid #ccab74;padding:8px 11px;background:#242a31;color:#e1d3ba;margin:14px 0;font-size:13px}.submit{background:#ddbe84;border:0;border-radius:11px;padding:13px 18px;color:#202026;font-weight:900;width:100%;cursor:pointer;font-size:16px}.submit:disabled{opacity:.5;cursor:wait}#result{font-weight:700;font-size:13px;margin-top:14px}.hidden{display:none}.sr-only{position:absolute;left:-9999px}
</style></head><body><main><div class="tag">TAICHUNG × TAOYUAN / VOLUNTEER</div><h2>志工協助意願登記</h2><p>幹部自薦請透過桃園工會信箱；這份表單是供願意協助活動、設計、資料與溝通等工作的志工使用。</p>
<form id="vf"><div class="tabs"><label><input type="radio" name="mode" value="anonymous" checked> 匿名志工<small class="muted" style="display:block">不強制填姓名與工號</small></label><label><input type="radio" name="mode" value="named"> 具名志工<small class="muted" style="display:block">可由管理員個別聯繫</small></label></div>
<div id="anonHint" class="hint">匿名申請不要求姓名、工號或部門；如自行提供手機、LINE ID 或 Email，管理員仍可能據此辨識身分。完全不留聯絡方式則無法私下通知或分派任務，請自行留意社群公開資訊。</div>
<div id="namedFields" class="hidden"><div class="field"><label class="t" for="name">姓名（具名必填）</label><input id="name" type="text" maxlength="40" autocomplete="name"></div><div class="field"><label class="t" for="staffId">工號（選填）</label><input id="staffId" type="text" maxlength="30" autocomplete="off"></div><div class="field"><label class="t" for="dept">部門（選填）</label><input id="dept" type="text" maxlength="60" autocomplete="off"></div></div>
<div class="field"><label class="t" for="site">所屬廠區（選填）</label><select id="site"><option value="">不提供</option><option>台中</option><option>桃園</option><option>銅鑼</option><option>台南</option><option>其他</option></select></div>
<div class="field"><label class="t" for="contact">聯絡方式 <span id="contactRequirement" class="muted">（匿名選填；若提供可能暴露身分）</span></label><input id="contact" type="text" maxlength="120" placeholder="Email、LINE ID 或手機號碼，擇一即可" autocomplete="off"></div>
<fieldset><legend>我能協助的項目（至少一項，可複選）</legend><div id="skills"></div></fieldset><fieldset><legend>方便支援的時間（可複選）</legend><div id="times"></div></fieldset>
<label style="display:flex;gap:5px;align-items:flex-start;font-size:13px;color:#c8d1dd"><input id="agree" type="checkbox" required style="margin-top:5px">我同意將所填資料存入管理員限定的「志工申請」試算表，僅用於協調志工、安排支援與必要聯繫；不填公司機密或他人個資。如需更正、刪除，可寫信至 micronunions@gmail.com 提出請求（實際處理方式由管理團隊確認）。</label>
<input class="sr-only" name="website" id="trap" tabindex="-1" autocomplete="off"><button class="submit" type="submit" id="send">送出志工申請</button><div id="result" aria-live="polite"></div></form><p class="muted">本表單由員工自發整理；非官方工會人事任命或志工錄取保證。</p></main>
<script>
const skills=['海報與視覺設計','群組資訊傳達與同仁溝通','活動支援與現場工作','資料整理與分析／AI 技術','外語翻譯','媒體採訪／影音協助','議題整理與研究','其他'];
const times=['平日白天','平日晚上','週末／假日','遠端線上','時間不固定'];
function addChecks(id,items){document.getElementById(id).innerHTML=items.map((v,i)=>`<label><input type="checkbox" value="${v.replace(/"/g,'&quot;')}"> ${v}</label>`).join('')}
addChecks('skills',skills);addChecks('times',times);
function switchMode(){const named=document.querySelector('[name=mode]:checked').value==='named';document.getElementById('namedFields').classList.toggle('hidden',!named);document.getElementById('anonHint').classList.toggle('hidden',named);document.getElementById('name').required=named;document.getElementById('contact').required=named;document.getElementById('contactRequirement').textContent=named?'（必填）':'（匿名選填；若提供可能暴露身分）';}
document.querySelectorAll('[name=mode]').forEach(n=>n.addEventListener('change',switchMode));
document.getElementById('vf').addEventListener('submit',ev=>{
 ev.preventDefault();const f=document.getElementById('vf'), b=document.getElementById('send'),o=document.getElementById('result');const picked=id=>Array.from(document.querySelectorAll('#'+id+' input:checked'),x=>x.value);
 const payload={mode:document.querySelector('[name=mode]:checked').value,name:document.getElementById('name').value,staffId:document.getElementById('staffId').value,dept:document.getElementById('dept').value,site:document.getElementById('site').value,contact:document.getElementById('contact').value,skills:picked('skills'),times:picked('times'),agree:document.getElementById('agree').checked,trap:document.getElementById('trap').value};
 if(!payload.skills.length){o.textContent='請至少勾選一項能協助的事情';return}b.disabled=true;o.textContent='正在寫入資料…';
 google.script.run.withSuccessHandler(res=>{b.disabled=false;if(res&&res.ok){o.textContent='✅ 已完成申請並存入後台。編號：'+res.code;f.reset();switchMode();}else{o.textContent='寫入結果不明，請聯絡管理員確認';}}).withFailureHandler(err=>{b.disabled=false;o.textContent='❌ '+(err.message||'提交失敗，請重試');}).submitVolunteer(payload);
});
</script></body></html>
