<!DOCTYPE html><html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#f5f6fa;font-family:system-ui,'PingFang TC',sans-serif}main{padding:24px;max-width:1200px;margin:auto}h1{font-size:25px;margin:5px 0 10px}p{font-size:13px;color:#aebdcc}.login{padding:20px;background:#202936;border:1px solid #4c5969;border-radius:16px;max-width:500px}label{display:block;margin-bottom:8px;font-weight:800}input{width:100%;font-size:16px;padding:11px;background:#0e1620;border:1px solid #607084;border-radius:10px;color:#fff}button{border:0;background:#debd83;color:#11161c;border-radius:9px;padding:11px 16px;margin-top:13px;font-weight:900;cursor:pointer}button:disabled{opacity:.5}.tablewrap{overflow:auto;border:1px solid #4d5865;border-radius:12px;margin-top:18px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th,td{border-bottom:1px solid #353d49;padding:11px;text-align:left;max-width:320px;overflow-wrap:anywhere;white-space:normal}th{background:#293748;position:sticky;top:0}tr:nth-child(2n){background:#18212c}#result{margin:13px 0;color:#f4c58c}#panel{display:none}.tiny{font-size:11px;color:#9cabbc}
</style></head><body><main><div class="tiny">ADMIN ACCESS · SERVER VERIFIED</div><h1>志工申請｜管理員查閱</h1><p>密碼只在伺服器端驗證，資料不會直接寫入公開網站或嵌入公開 HTML。請勿與非管理成員分享密碼及試算表存取權。</p><div class="login" id="login"><label for="pwd">管理員密碼</label><input id="pwd" type="password" autocomplete="off" minlength="16" placeholder="請輸入後台密碼"><button type="button" id="load">登入並讀取最近 300 筆</button><div id="result" aria-live="polite"></div></div>
<div id="panel"><p id="stat"></p><button type="button" id="refresh">更新資料</button><button type="button" id="logout">登出</button><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p class="tiny">同一工作表的完整資料，可由具備 Google 試算表存取權的管理人員在工作表中檢視。此頁僅顯示最近 300 筆。</p></div></main><script>
let password='';const by=id=>document.getElementById(id);
function showError(e){by('load').disabled=false;by('refresh').disabled=false;by('result').textContent='❌ '+(e.message||'讀取失敗');password='';by('panel').style.display='none';}
function load(){password=by('pwd').value;if(!password){by('result').textContent='請輸入管理員密碼';return;}by('result').textContent='正在驗證與讀取…';by('load').disabled=true;by('refresh').disabled=true;
 google.script.run.withSuccessHandler(res=>{by('load').disabled=false;by('refresh').disabled=false;by('result').textContent='';by('panel').style.display='block';by('stat').textContent=`共 ${res.total} 筆申請｜顯示最近 ${res.rows.length} 筆（新到舊）`;by('thead').replaceChildren();by('tbody').replaceChildren();const head=document.createElement('tr');res.headers.forEach(h=>{const el=document.createElement('th');el.textContent=h;head.appendChild(el)});by('thead').appendChild(head);res.rows.forEach(r=>{const tr=document.createElement('tr');r.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});by('tbody').appendChild(tr)});by('pwd').value='';}).withFailureHandler(showError).getVolunteersForAdmin(password);
}
by('load').onclick=load;by('refresh').onclick=()=>{if(password){by('pwd').value=password;load()}};by('logout').onclick=()=>{password='';by('pwd').value='';by('panel').style.display='none';by('tbody').replaceChildren();by('result').textContent='已清除本頁登入狀態';};by('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script></body></html>
