const records=[["14:27", "幹部", "請公司說明一下45億投資暫停的部分"], ["14:27", "Ray", "美光在全世界的擴張都很重要，我們給Bloomberg的資訊外，依證交法不能另外提供資訊，但台灣對美光非常重要，台灣人才跟環境都很好，在台灣的生態系內，希望大家都能一起成長"], ["14:27", "幹部", "那應該是海力士造的謠吧"], ["14:28", "Ray", "謝謝，我們會帶回去討論"], ["14:28", "GH", "我們不評論謠言"], ["14:29", "GH", "美光第一線技術人員的薪酬是業界3倍\n作為美國公司我們打破了常規，做了一個有透明度能預測的分潤制\n市長任職過的google跟no都沒有分潤制\n但美光的董事會很有誠意的打造了一個分潤制\n只要27年以後表現比26好就會有獎金\n我們把ipp上限打開，maxout的範圍也打開"], ["14:30", "現場轉述", "市長打斷，因為要提前離開：從玉鳳的說明美光在開發分潤系統但還沒完整，請問什麼時候會有完整的系統可以落地"], ["14:31", "現場轉述", "會員反映剛剛玉鳳說的東西就是在公司ATM裡面說的內容"], ["14:32", "現場轉述", "本次會議預計五點就會結束"], ["14:32", "GH", "美光24 25年發得都比其他公司好"], ["14:33", "GH", "除了這些獎金我們更重視的是長遠的未來"], ["14:36", "GH", "我們的調薪跟底薪是很有競爭力的，不應該只看在獎金的部分"], ["14:39", "秘書", "沒有聽到上次會議記錄中請公司回應的問題"], ["14:39", "局長", "公司說美國證交法的問題不能披露"], ["14:39", "秘書", "哪一條法律可以披露吧"], ["14:40", "現場轉述", "局長做球"], ["14:44", "勞律", "公司說美國證交法規定不能披露分潤趴數，我們當下就有查到有美國公司披露分潤"], ["14:45", "Ray", "我不同意我對證交法的解釋被非美國證交法專業的人挑戰"], ["14:46", "Ray", "達美航空過去有揭露但美光沒有"], ["14:48", "勞律", "我們有律師證照且也有英文能力的人應該是能互相討論的，如果您有更權威的解釋可以拿出來討論"], ["14:52", "勞律", "我們的理解是法規的重點是要平等的對待所有投資人，有很多方法可以揭露，但美光卻不揭露，頗說是違法的"], ["14:53", "GH", "我給你一些問題你回去思考一下，當有一間公司跟你說分10%到底能分到多少錢，怎麼分你知道嗎"], ["14:55", "GH", "每個國家的稅法都不一樣，例如買房時新加坡的30坪跟台灣的30坪完全不一樣，不同國家怎麼比？"], ["14:57", "GH", "一直談多少%沒有意義，我們要台灣的同仁知道真的能拿到多少，他們不能用%數去還房貸養小孩"], ["15:02", "幹部", "員工沒有感受到馬克在atm上說的數字，員工也試算過美光的獎金是很低的\n我們沒聽到Ray有提出一個實質的法條說不能講分潤%數"], ["15:03", "GH", "華邦電的是新聞寫的，我想問的是下下季跟更遠的未來"], ["15:08", "現場轉述", "使出PPT攻擊中"], ["15:10", "GH", "拿出投影片想說其他美商巨頭都沒有季分潤，說美光薪酬跟其他台廠比很高了，若只看%數那大家都應該去旺宏工作，然後列出一堆其他公司的獎金數字比美光低的表格"], ["15:11", "GH", "同仁不喜歡分潤目標，所以我們把它從ion拿掉了"], ["15:13", "GH", "再提韓廠被告背信警方調查中，說韓國所得稅率很高，扣掉勞健保剩4%到手，三星獎金100%股票"], ["15:23", "法務", "台廠的分潤只會公告總額，每個人會領到多少在發薪當天才知道"], ["15:23", "幹部", "我們問的就是總額啊"], ["15:24", "法務", "證交法"], ["15:25", "公司轉述", "從台積雇的新幕僚：台積電根本不允許有工會，美光FY26在台灣的薪酬比其它台廠高很多了"], ["15:25", "現場轉述", "投影片用美光26比台廠25，幕僚說因為26的數據要明年才出來"], ["15:27", "現場轉述", "投影片顯示其他台廠25薪資中位數跟美光26年D2薪酬\n幹部：有美光中位數嗎？\nGH：為什麼要中位數？我們最低就比人家中位數高了"]];const originalPhoto="data:imag const container=document.getElementById('timeline'),search=document.getElementById('search'),lightbox=document.getElementById('lightbox');let limit=records.length;
document.getElementById('stats').textContent='14:27 — 15:27 · '+records.length+' 則已整理紀錄';
function category(s){return /^(GH|Ray|法務|公司轉述)$/.test(s)?'company':/^(幹部|秘書|勞律)$/.test(s)?'union':'mixed'}
function filtered(){const q=search.value.trim().toLowerCase();return records.filter(r=>r.join(' ').toLowerCase().includes(q))}
function addPhoto(){const section=document.createElement('section');section.className='photo';const btn=document.createElement('img');btn.src=originalPhoto;btn.loading='lazy';btn.alt='15:08 現場投影片原始照片：美光基層與工程職群薪酬比較';btn.tabIndex=0;btn.setAttribute('role','button');btn.setAttribute('aria-label','點擊放大現場投影片原始照片');btn.onclick=openPhoto;btn.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhoto()}};const caption=document.createElement('p');caption.textContent='15:08 現場投影片原始照片（點擊可放大）｜會場簡報內容，非經獨立查證之薪資數據';section.append(btn,caption);container.append(section)}
function render(){container.replaceChildren();let list=filtered().slice(0,limit);for(const [time,who,content] of list){const article=document.createElement('article');article.className='message '+category(who);const dot=document.createElement('div');dot.className='dot';const bubble=document.createElement('div');bubble.className='bubble';const meta=document.createElement('div');meta.className='meta';const t=document.createElement('time');t.textContent=time;const label=document.createElement('span');label.textContent=who==='現場轉述'?'現場紀錄':who;meta.append(t,label);const body=document.createElement('div');body.className='body';body.textContent=content;bubble.append(meta,body);article.append(dot,bubble);container.append(article);if(time==='15:08')addPhoto()}}
function openPhoto(){document.getElementById('largephoto').src=originalPhoto;lightbox.showModal()}
document.getElementById('closephoto').onclick=()=>lightbox.close();lightbox.onclick=e=>{if(e.target===lightbox)lightbox.close()};
search.addEventListener('input',()=>{limit=records.length;render()});document.getElementById('showall').onclick=()=>{limit=records.length;render()};document.getElementById('reset').onclick=()=>{search.value='';limit=records.length;render();window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('copy').onclick=async()=>{const value=filtered().map(r=>r[0]+' '+r[1]+'：'+r[2]).join('\n\n');try{await navigator.clipboard.writeText(value);alert('已複製')}catch(e){alert('無法自動複製，請手動選取文字')}};render();
</script></body></html>
