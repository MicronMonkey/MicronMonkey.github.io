<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/v3-admin/manifest.webmanifest"><link rel="apple-touch-icon" href="/v3-admin/icon-192.png"><link rel="icon" type="image/png" href="/v3-admin/icon-192.png"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-title" content="光光猴管理"><meta name="apple-mobile-web-app-capable" content="yes"><title>光光猴 V3 · 公告管理</title><link rel="stylesheet" href="/v3-preview/guardian.css"><style>body{margin:0;background:#101820;color:#e6edf5;font:15px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:18px}h1{font-size:22px;color:#ebcc91}input:not([type=checkbox]),select,textarea{box-sizing:border-box;display:block;width:100%;background:#101820;border:1px solid #536171;color:#fff;padding:10px;border-radius:8px;margin:4px 0 12px;font:inherit}textarea{min-height:110px}button{cursor:pointer}a{color:#ebcc91}label{display:block!important;border:0!important;padding:4px 0!important}label:has(input[type=checkbox]){display:flex!important}#status{white-space:pre-wrap;color:#ebcc91}#preview{white-space:pre-wrap;padding:12px;background:#26323d;border-radius:8px}#admin-list article,#admin-requests article{border-top:1px solid #34404a;padding:12px 0}#admin-list strong,#admin-requests strong{display:block}#admin-list small,#admin-requests small{color:#aab7c4} [hidden]{display:none!important}</style></head><body><main><a href="/v3-preview/index.html">← 回 V3 測試版</a><div style="display:flex;align-items:center;gap:12px;margin:16px 0"><img src="/v3-admin/icon-192.png" alt="" width="56" height="56" style="border-radius:13px"><div><h1 style="margin:0">公告與推播管理</h1><small style="color:#aab7c4">GUARDIAN ADMIN</small></div></div><section class="g3-card" id="admin-install"><h2>📲 安裝管理員 App</h2><p id="admin-install-help">iPhone：Safari 分享 → 加入主畫面。Android：Chrome 選單 → 安裝應用程式／加到主畫面。</p><div class="g3-controls"><button type="button" class="g3-primary" id="admin-install-btn" hidden>安裝管理員 App</button></div></section><p>僅經授權的管理員可以發布公告。測試版推播不會發送給正式網站訪客。</p><section id="login" class="g3-card"><h2>管理員登入</h2><form id="login-form"><label>電子郵件<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><label><input id="remember" type="checkbox"> 保持登入（僅限私人裝置）</label><details><summary>首次登入？輸入邀請碼</summary><label>邀請碼<input id="login-code" autocomplete="off" maxlength="40"></label></details><div class="g3-controls"><button class="g3-primary" type="submit">登入</button></div></form><div class="g3-controls"><button id="show-register" type="button" hidden>註冊管理員帳號</button><button id="show-login" type="button" hidden>返回登入</button></div><form id="register-form" hidden><label>管理員邀請碼<input id="register-code" autocomplete="off" maxlength="40" required></label><label>電子郵件<input id="register-email" type="email" autocomplete="email" required maxlength="254"></label><label>設定密碼（至少 12 字元）<input id="register-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>確認密碼<input id="register-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><div class="g3-controls"><button id="register-submit" class="g3-primary" type="submit">註冊並驗證信箱</button></div></form><p id="register-note">目前未開放新管理員註冊。</p></section><section id="editor" class="g3-card" hidden><div class="g3-controls"><button id="logout" type="button">登出</button></div><h2 id="editor-title">新增公告</h2><form id="notice-form"><label>標題<input id="title" maxlength="100" required></label><label>內容<textarea id="body" maxlength="3000" required></textarea></label><label>公告等級<select id="level"><option value="normal">一般</option><option value="important">重要</option><option value="urgent">緊急</option></select></label><label>跳轉頁面<select id="destination"><option value="#news">最新消息</option><option value="#action">我要行動</option><option value="#home">首頁</option><option value="#community">交流互動</option><option value="#more">更多資訊</option></select></label><label>到期時間（選填，台灣時間）<input id="expires" type="datetime-local"></label><label><input id="pinned" type="checkbox"> 置頂首頁公告</label><label><input id="push" type="checkbox"> 發送手機推播（新增公告時可選，預設不勾選）</label><h2>通知預覽</h2><div id="preview">尚未輸入</div><div class="g3-controls"><button class="g3-primary" id="publish" type="submit">發布公告</button><button id="cancel" type="button" hidden>取消編輯</button></div></form><h2 style="margin-top:20px">已發布公告</h2><div class="g3-controls"><button id="reload" type="button">重新整理</button></div><div id="admin-list"></div><section id="admin-management" class="g3-card" hidden><h2>管理員邀請</h2><p>建立邀請碼即開放註冊；信箱驗證後自動授權，不需人工審核。請只分享給信任的人。</p><form id="invite-form"><label>備註（選填）<input id="invite-label" maxlength="80" placeholder="例如：志工管理員"></label><label>有效期限<select id="invite-hours"><option value="24">24 小時</option><option value="72">3 天</option><option value="168">7 天</option><option value="720">30 天</option></select></label><label>可使用次數<input id="invite-uses" type="number" min="1" max="100" value="15" required></label><div class="g3-controls"><button type="submit" class="g3-primary">產生邀請碼</button></div></form><div id="new-code-wrap" hidden><label>新邀請碼（僅顯示此次）<input id="new-code" readonly></label><div class="g3-controls"><button id="copy-code" type="button">複製邀請碼</button></div></div><div class="g3-controls"><button id="reload-requests" type="button">更新清單</button><button id="close-invites" type="button">關閉所有邀請</button></div><div id="admin-requests"></div></section></section><p id="status" role="status"></p></main><script src="/action-report-config.js"></script><script src="/v3-admin/admin.js?v=2"></script><script>let installEvent=null;const installCard=document.getElementById("admin-install"),installBtn=document.getElementById("admin-install-btn"),help=document.getElementById("admin-install-help");function paintInstall(){const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;installCard.hidden=standalone;installBtn.hidden=!installEvent;if(!standalone&&/iPhone|iPad|iPod/.test(navigator.userAgent))help.textContent="使用 Safari 開啟，點分享 → 加入主畫面 → 加入，即可獨立開啟管理後台。";}window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvent=e;paintInstall()});installBtn.addEventListener("click",async()=>{if(!installEvent)return;await installEvent.prompt();await installEvent.userChoice;installEvent=null;paintInstall()});window.addEventListener("appinstalled",()=>{installEvent=null;installCard.hidden=true});paintInstall();if("serviceWorker" in navigator)navigator.serviceWorker.register("/v3-admin/sw.js",{scope:"/v3-admin/"}).catch(()=>{});</script></body></html>
